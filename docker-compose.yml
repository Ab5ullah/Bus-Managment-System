version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: busms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-busms_db}
      POSTGRES_USER: ${DB_USER:-busms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-busms_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-busms_user} -d ${DB_NAME:-busms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: busms_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
